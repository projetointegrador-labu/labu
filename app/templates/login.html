{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao cartao--estreito">
  <h1>Entrar</h1>
  {% if erro %}<p class="alerta alerta--erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="campo"><label for="email">E-mail</label>
      <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email" autofocus></div>
    <div class="campo"><label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password"></div>
    <button type="submit" class="btn btn--grande">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}
