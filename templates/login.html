<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>Labu: prestadores de serviços mais próximo de você</title>
</head>
<body>
    <h1>LABU</h1>
    <form action="/acesso" method="post">
        <h1>Login</h1>
        {% set menssagens = get_flashed_messages() %}
        {% if menssagens %}
            <div id="alerta" style="font-size: 15px;">
                {{menssagens[0]}}
            </div>
        {% endif %}
        <label for="email">Email</label>
        <input type="text" name="email" id="email">
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha">
        
        <div class="button-container">
            <button type="submit">Entrar</button>
            <button><a href="/cadastro" style="text-decoration:none;" class="btn-login">Cadastre-se</a></button>
        </div>    
    </form>    

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
